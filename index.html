<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>La Entrevista</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: una columna tipo "sala de declaración": ficha del caso, transcripción y tres tarjetas de pregunta. */
:root {
  --bg: #e9edf2;
  --paper: #ffffff;
  --ink: #17233a;
  --muted: #5b6a82;
  --line: #cfd7e3;
  --accent: #2f55d4;
  --accent-soft: #e2e9ff;
  --mark: #ffd75e;
  --good: #1f8a57;  --good-soft: #dcf3e7;
  --mid:  #b7791f;  --mid-soft:  #fbefd8;
  --bad:  #c2413b;  --bad-soft:  #fbe1df;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1522; --paper: #172034; --ink: #e6ecf7; --muted: #9aa8c0; --line: #2a3650;
  --accent: #8aa6ff; --accent-soft: #223056; --mark: #8a6d12;
  --good: #5fd39a; --good-soft: #143326; --mid: #f0b456; --mid-soft: #3a2c12; --bad: #ff8a83; --bad-soft: #3d1a1a;
  color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg: #0f1522; --paper: #172034; --ink: #e6ecf7; --muted: #9aa8c0; --line: #2a3650;
  --accent: #8aa6ff; --accent-soft: #223056; --mark: #8a6d12;
  --good: #5fd39a; --good-soft: #143326; --mid: #f0b456; --mid-soft: #3a2c12; --bad: #ff8a83; --bad-soft: #3d1a1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 780px; margin: 0 auto; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.1; }
p { margin: 0; }
.label { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Barra superior */
.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; background: none; border: 0; padding: 0; }
.brand span { background: linear-gradient(transparent 58%, var(--mark) 58%); }
.meters { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.meter { display: grid; gap: 4px; }
.steps { display: flex; gap: 4px; }
.steps i { width: 18px; height: 8px; border-radius: 2px; background: var(--line); }
.steps i.done-good { background: var(--good); } .steps i.done-mid { background: var(--mid); } .steps i.done-bad { background: var(--bad); }
.steps i.now { background: var(--accent); }
.counts { display: flex; gap: 6px; }
.pill { font-family: var(--f-mono); font-size: 13px; padding: 3px 10px; border-radius: 99px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.g { background: var(--good-soft); color: var(--good); } .pill.m { background: var(--mid-soft); color: var(--mid); } .pill.b { background: var(--bad-soft); color: var(--bad); }

/* Ficha */
.ficha { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 20px 22px; display: grid; gap: 14px; }
.ficha summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.ficha summary::-webkit-details-marker { display: none; }
.ficha summary .label::after { content: " ▸ ver ficha"; }
.ficha[open] summary .label::after { content: " ▾ ocultar"; }
.ficha dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; }
.ficha dt { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 3px; }
.ficha dd { margin: 0; min-width: 0; }
.ficha .tener { background: var(--accent-soft); border-radius: 4px; padding: 10px 12px; font-size: 15px; }
@media (max-width: 520px) { .ficha dl { grid-template-columns: 1fr; gap: 2px; } .ficha dd { margin-bottom: 8px; } }

/* Intro y selector */
.intro h1 { font-size: clamp(34px, 7vw, 56px); font-weight: 800; letter-spacing: -.02em; }
.intro p { max-width: 64ch; color: var(--muted); margin-top: 10px; }
.legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rule { padding: 12px 14px; border-radius: 6px; font-size: 15px; }
.rule b { display: block; font-family: var(--f-display); font-size: 18px; }
.rule.g { background: var(--good-soft); } .rule.g b { color: var(--good); }
.rule.m { background: var(--mid-soft); }  .rule.m b { color: var(--mid); }
.rule.b { background: var(--bad-soft); }  .rule.b b { color: var(--bad); }
.marks-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 15px; color: var(--muted); }
.cases { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.case { text-align: left; background: var(--paper); border: 2px solid var(--line); border-radius: 8px; padding: 16px 18px; display: grid; gap: 6px; align-content: start; transition: border-color .15s, transform .15s; }
.case:hover { border-color: var(--accent); transform: translateY(-2px); }
.case h3 { font-size: 22px; }
.case .ev { color: var(--muted); font-size: 15px; }
.case .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; }
.tagw { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
@media (max-width: 600px) { .cases, .legend { grid-template-columns: 1fr; } }

.cta { justify-self: start; background: var(--accent); color: var(--paper); border: 0; border-radius: 6px; padding: 12px 22px; font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.cta:hover { filter: brightness(1.08); }
.ghost { background: transparent; border: 2px solid var(--line); border-radius: 6px; padding: 10px 18px; font-family: var(--f-display); font-weight: 700; }
.ghost:hover { border-color: var(--accent); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }

/* Fase */
.phase-head { display: grid; gap: 6px; }
.phase-head h2 { font-size: clamp(26px, 5vw, 36px); font-weight: 700; }
.principio { justify-self: start; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; background: var(--mark); color: var(--ink); padding: 2px 8px; border-radius: 3px; }
.context { color: var(--muted); font-style: italic; }
.transcript { display: grid; gap: 10px; }
.line { display: grid; grid-template-columns: 80px 1fr; gap: 12px; align-items: start; }
.line .who { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 4px; overflow-wrap: anywhere; }
.line .said { min-width: 0; }
.line.wit .said { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
.line.you .said { font-weight: 600; padding: 4px 0; }
.line.new .said { animation: pop .35s ease; }
@keyframes pop { from { transform: translateY(6px); opacity: .3; } to { transform: none; opacity: 1; } }
.ok { text-decoration: underline 2px var(--good); text-underline-offset: 3px; }
.fx { background: var(--bad-soft); color: var(--bad); border-radius: 3px; padding: 0 3px; text-decoration: underline wavy 1px var(--bad); text-underline-offset: 3px; }
.gain { font-size: 15px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; padding-left: 92px; }
@media (max-width: 480px) { .gain { padding-left: 0; } }

.options { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--paper); border: 2px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; grid-template-columns: 28px 1fr; gap: 12px; transition: border-color .15s, transform .15s; }
.opt:hover:not(:disabled) { border-color: var(--accent); transform: translateX(3px); }
.opt:disabled { cursor: default; }
.opt .k { font-family: var(--f-mono); font-size: 14px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.opt .q { font-size: 18px; min-width: 0; }
.opt .fb { grid-column: 2; display: grid; gap: 4px; font-size: 15px; color: var(--muted); }
.opt .fb .tag { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.opt.r-good { border-color: var(--good); } .opt.r-good .tag { color: var(--good); } .opt.r-good .k { background: var(--good-soft); color: var(--good); }
.opt.r-mid  { border-color: var(--mid); }  .opt.r-mid .tag  { color: var(--mid); }  .opt.r-mid .k  { background: var(--mid-soft); color: var(--mid); }
.opt.r-bad  { border-color: var(--bad); }  .opt.r-bad .tag  { color: var(--bad); }  .opt.r-bad .k  { background: var(--bad-soft); color: var(--bad); }
.opt.revealed:not(.chosen) { opacity: .62; border-style: dashed; }
.opt.chosen.r-good { box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--good); }
.opt.chosen.r-mid  { box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--mid); }
.opt.chosen.r-bad  { box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--bad); }

/* Resultado */
.score { display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: end; }
.big { font-family: var(--f-display); font-weight: 800; font-size: clamp(64px, 16vw, 112px); line-height: .9; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.big small { font-size: .35em; color: var(--muted); font-weight: 500; }
.verdict { min-width: 0; flex: 1 1 260px; }
.verdict h2 { font-size: 28px; }
.verdict p { margin-top: 6px; color: var(--muted); max-width: 48ch; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.box { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.box h3 { font-size: 20px; }
.box ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.box .none { color: var(--muted); font-style: italic; }
.box.g h3 { color: var(--good); } .box.b h3 { color: var(--bad); }
.truth { background: var(--accent-soft); border-radius: 6px; padding: 16px 18px; display: grid; gap: 6px; }
@media (max-width: 600px) { .compare { grid-template-columns: 1fr; } }
.review { display: grid; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
.rv { display: grid; grid-template-columns: 6px 1fr auto; gap: 14px; padding: 14px 16px; border-top: 1px solid var(--line); align-items: start; }
.rv:first-child { border-top: 0; }
.rv .stripe { align-self: stretch; border-radius: 3px; }
.rv .body { min-width: 0; display: grid; gap: 3px; }
.rv .body .q { font-weight: 600; }
.rv .body .why { color: var(--muted); font-size: 15px; }
.rv .body .better { font-size: 15px; }
.rv .body .better b { color: var(--good); font-weight: 600; }
.rv .pts { font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; }
.s-good { background: var(--good); } .s-mid { background: var(--mid); } .s-bad { background: var(--bad); }
@media (max-width: 480px) { .line { grid-template-columns: 1fr; gap: 2px; } .rv { grid-template-columns: 6px 1fr; } .rv .pts { grid-column: 2; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.own { background: var(--mid-soft); color: var(--mid); border-radius: 3px; padding: 0 3px; text-decoration: underline dashed 1px var(--mid); text-underline-offset: 3px; }
.box.o h3 { color: var(--mid); }
.box s { color: var(--muted); }
.atestado { border-left: 4px solid var(--accent); padding: 4px 0 4px 14px; font-size: 15px; display: grid; gap: 6px; }
.atestado b { font-family: var(--f-display); }
.compare.three { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 760px) { .compare.three { grid-template-columns: 1fr; } }
.tablewrap { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 15px; }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
td.y { color: var(--good); } td.n { color: var(--bad); } td.d { color: var(--muted); }
.debate { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.reveal { display: grid; gap: 14px; }
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   CASO: atraco en el Minimarket Rosa (Gràcia, Barcelona) — 4 testigos.
   Marcas en las respuestas del testigo:
     [[texto]] = detalle exacto
     {{texto}} = detalle falso inducido por la pregunta del entrevistador
     ((texto)) = error propio del testigo (lo aporta él solo, sin que se lo sugieran)
   Opciones especiales:
     flag: "meta"     -> activa el control metacognitivo; las respuestas con respuestaMeta cambian
     corrige: true    -> el testigo corrige sus errores propios (pasan a "corregidos")
   ========================================================= */
const PUNTOS = { good: 10, mid: 5, bad: 0 };
const ETIQUETA = { good: "Bien formulada", mid: "Mejorable", bad: "Mal formulada" };

const ATESTADO = {
  cabecera: "Mossos d'Esquadra · Comisaría de Gràcia · Diligencia n.º 2026/4471",
  texto: "Sábado 14/11, aprox. 23:40 h. Robo con intimidación en el Minimarket Rosa, c/ Verdi 112. El dependiente refiere que un individuo le exigió el dinero de la caja y huyó. Presenta una contusión leve. La cámara del local no funcionaba.",
  objetivo: "Obtener descripción del autor o autores, objeto empleado, vehículo y dirección de huida."
};

const HECHOS = [
  "23:36 · Llega una scooter gris oscuro con dos hombres y para en doble fila delante de la tienda. La matrícula termina en 47.",
  "23:38 · El autor 1 entra; el autor 2 se queda en la moto con el motor encendido. El autor 1 se cuela delante de Laia, saca un destornillador grande de mango amarillo (no un cuchillo) y dice: «La caja. Rápido. No me hagas hacerlo».",
  "23:39 · Ravi, el dependiente, le da 385 € de la caja. El autor 1 coge también dos cartones de tabaco. Al salir empuja a Ravi, que cae contra la estantería de patatas.",
  "23:40 · Huyen calle arriba (dirección montaña) y giran a la derecha en la primera esquina. Todo duró 1 minuto y 40 segundos.",
  "Autor 1: 25-30 años, 1,80 m, delgado. Chaqueta acolchada verde oliva con capucha y gorra negra debajo. Mascarilla quirúrgica azul (se la baja al hablar). Vaqueros oscuros, zapatillas blancas con suela roja. Tatuaje de una golondrina en el dorso de la mano derecha. Acento local, voz ronca, olor a tabaco.",
  "Autor 2: 30-40 años, barba corta, casco blanco abierto tipo jet, chaqueta negra, mochila cuadrada de reparto amarilla. No baja de la moto.",
  "Solo había dos autores. No hubo cuchillo, ni pistola, ni nadie vigilando en la esquina (era un vecino paseando al perro)."
];

const CASOS = [
{
  id: "montse", grupo: "Persona mayor", nombre: "Montse", edad: "81 años",
  titulo: "Testigo 1 · Montse, 81 años",
  evento: "La vecina del balcón de enfrente. Vio la llegada y la huida desde arriba.",
  datos: [
    ["Testigo", "Montserrat P., 81 años. Viuda, jubilada (fue modista). Vive sola enfrente de la tienda desde hace 50 años"],
    ["Dónde estaba", "En su balcón del primer piso, sin las gafas de lejos"],
    ["Entrevista", "Domingo por la mañana, en su casa"]
  ],
  tener: "Su punto fuerte es el vehículo, el conductor y la huida: conoce el barrio. Su punto débil, la hora y la sugestionabilidad. Lleva audífono en el oído izquierdo y se va por las ramas. Hace dos años atracaron la farmacia de la esquina con una moto roja: si se menciona, puede mezclar los dos sucesos.",
  fases: [
    { fase: "Introducción", principio: "Rapport, adaptación y rol activo",
      contexto: "Montse te abre la puerta y te ofrece un café. Os sentáis en el comedor.", testigo: null,
      opciones: [
        { q: "Buenos días, Montse, gracias por recibirme. Me siento aquí delante para que me oiga bien. Usted vio lo que pasó y yo no, así que vamos a su ritmo.", calidad: "good", tipo: "Rapport + adaptación + rol activo",
          porque: "Tiene en cuenta el audífono, le cede el protagonismo y deja claro que el ritmo lo marca ella.",
          respuesta: "Ay, qué bien, porque por este oído no oigo nada. Cincuenta años llevo aquí, conozco a todo el mundo. Yo estaba [[en el balcón, recogiendo la ropa porque había empezado a llover]]." },
        { q: "Buenos días, Montse, gracias por recibirme. Para no robarle mucho tiempo, yo le haré unas preguntas concretas y usted me va contestando, ¿le parece bien?", calidad: "mid", tipo: "Testigo en rol pasivo",
          porque: "Es amable, pero la coloca en un papel pasivo de responder preguntas. La EC pide cederle el control del relato. Tampoco tiene en cuenta el audífono.",
          respuesta: "Sí, sí, usted pregunte... aunque no sé si sabré contestarle bien." },
        { q: "Buenos días, Montse, gracias por recibirme. No se preocupe si no se acuerda de todo, que a su edad es lo más normal. Iremos poco a poco.", calidad: "bad", tipo: "Expectativa negativa · edadismo",
          porque: "Suena comprensivo, pero le transmite que su memoria no es fiable por la edad. Esa expectativa reduce su confianza y lo que cuenta.",
          respuesta: "Bueno... sí, ya no tengo la memoria de antes. Igual no le sirvo de mucho." }
      ] },
    { fase: "Reinstauración del contexto", principio: "Contexto físico: entrevistar en el lugar",
      contexto: "La entrevista es en su casa, a pocos pasos del balcón.", testigo: "Yo esa noche estaba con mis cosas, ¿sabe?",
      opciones: [
        { q: "¿Le parece que salgamos un momento al balcón? Póngase donde estaba esa noche y piense con calma en la ropa, la lluvia y lo que oía.", calidad: "good", tipo: "Reinstauración del contexto físico",
          porque: "Aprovecha que la entrevista es en su casa para volver al lugar real del suceso. Es la forma más potente de reinstaurar el contexto.",
          respuesta: "Aquí, con las pinzas en la mano. Llovía flojito. Y abajo había [[una moto parada en doble fila]] [[con el motor en marcha, que hacía mucho ruido]]." },
        { q: "Para empezar a situarnos, ¿recuerda más o menos a qué hora fue? Así me hago una idea de cómo estaba la calle en ese momento.", calidad: "mid", tipo: "Determinativa sobre su punto débil",
          porque: "La hora es justo lo que Montse no sabe. Pedir un dato que no codificó lleva a una estimación equivocada.",
          respuesta: "Serían ((las once)), porque acababa de terminar el concurso de la tele." },
        { q: "Para situarnos un poco, supongo que usted estaría viendo la tele y se asomó al oír el ruido de la calle. ¿Fue más o menos así?", calidad: "bad", tipo: "Con expectativa · introduce información",
          porque: "Le propone una versión de lo que hacía. Ella estaba recogiendo la ropa, pero acepta la propuesta del entrevistador.",
          respuesta: "Sí, eso, {{estaba con la tele}} y {{me asomé por el ruido}}." }
      ] },
    { fase: "Narración libre", principio: "Relato completo y sin interrupciones",
      contexto: "Es el momento de que Montse cuente lo que vio.", testigo: "Pues mire, lo vi todo desde aquí arriba.",
      opciones: [
        { q: "Cuénteme con todo el detalle que pueda lo que vio desde el balcón, aunque le parezca poco importante. Tómese su tiempo, que yo la escucho.", calidad: "good", tipo: "Narración libre + informe completo",
          porque: "Pregunta abierta y con calma: deja que salga todo lo que recuerda, también la mochila amarilla, aunque se vaya por las ramas.",
          respuesta: "La moto era [[gris oscurita]]. El de la moto llevaba [[una de esas mochilas cuadradas amarillas de los repartidores]] y [[un casco blanco]]; pensé que era un repartidor. Luego oí [[un golpe fuerte y cosas que se caían]] dentro de la tienda, y [[un chico salió corriendo con algo bajo el brazo, como cajas]], y [[se subió detrás]]. Como cuando el hijo de la Pepi se compró la moto, que no veas el ruido..." },
        { q: "Cuénteme brevemente lo que vio desde el balcón, solo lo más importante, y luego ya iremos entrando en los detalles que hagan falta.", calidad: "mid", tipo: "Narración demasiado corta",
          porque: "Pedir un resumen recorta el relato libre. Montse se queda con lo básico y se pierde la mochila amarilla.",

let S = VACIO();
let mejores = {};
try { mejores = JSON.parse(localStorage.getItem("ec-rosa-mejores") || "{}") || {}; } catch (e) { mejores = {}; }

const caso = () => CASOS.find(c => c.id === S.caso);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function marcas(t) {
  return esc(t)
    .replace(/\[\[(.+?)\]\]/g, '<span class="ok" title="Detalle exacto">$1</span>')
    .replace(/\{\{(.+?)\}\}/g, '<span class="fx" title="Falso: lo ha introducido tu pregunta">$1</span>')
    .replace(/\(\((.+?)\)\)/g, '<span class="own" title="Error propio del testigo">$1</span>');
}
const RE_OK = /\[\[(.+?)\]\]/g, RE_FX = /\{\{(.+?)\}\}/g, RE_OWN = /\(\((.+?)\)\)/g;
const extrae = (t, re) => [...t.matchAll(re)].map(m => m[1]);
const opcion = p => caso().fases[p.f].opciones[p.o];
const respuesta = (o, flags) => (flags.meta && o.respuestaMeta) ? o.respuestaMeta : o.respuesta;
const puntos = picks => picks.reduce((s, p) => s + PUNTOS[opcion(p).calidad], 0);
function detalles() {
  const ok = [], fx = [], own = [];
  S.picks.forEach(p => { const r = p.r; ok.push(...extrae(r, RE_OK)); fx.push(...extrae(r, RE_FX)); own.push(...extrae(r, RE_OWN)); });
  const corrigio = S.picks.some(p => opcion(p).corrige);
  return { ok, fx, own: corrigio ? [] : own, corregidos: corrigio ? own : [] };
}
const totalExactos = c => c.fases.reduce((s, f) => s + Math.max(...f.opciones.map(o => Math.max(extrae(o.respuesta, RE_OK).length, extrae(o.respuestaMeta || "", RE_OK).length))), 0);

function topHTML() {
  let meters = "";
  if (S.caso && S.screen !== "ficha") {
    const c = caso(), d = detalles();
    const steps = c.fases.map((_, i) => {
      const p = S.picks.find(x => x.f === i);
      if (p) return `<i class="done-${opcion(p).calidad}"></i>`;
      return `<i class="${i === S.fase && S.screen === "fase" ? "now" : ""}"></i>`;
    }).join("");
    meters = `<div class="meters">
      <div class="meter"><span class="label">Fases</span><div class="steps" aria-label="Progreso">${steps}</div></div>
      <div class="meter"><span class="label">Declaración de ${esc(c.nombre)}</span><div class="counts"><span class="pill g">${d.ok.length} exactos</span><span class="pill b">${d.fx.length} inducidos</span><span class="pill m">${d.own.length} propios</span></div></div>
    </div>`;
  }
  return `<div class="top"><button class="brand" id="home-top" title="Volver a los testigos"><span>Minimarket Rosa</span></button>${meters}</div>`;
}
function bindTop() { const h = document.getElementById("home-top"); if (h) h.onclick = () => go(VACIO()); }

const atestadoHTML = () => `<div class="atestado"><span class="label">Atestado inicial</span><b>${esc(ATESTADO.cabecera)}</b><p>${esc(ATESTADO.texto)}</p><p><b>Objetivo:</b> ${esc(ATESTADO.objetivo)}</p></div>`;
function fichaHTML(c, abierta) {
  return `<details class="ficha" ${abierta ? "open" : ""}>
    <summary><span class="label">Ficha del testigo</span><h3>${esc(c.titulo)}</h3></summary>
    ${atestadoHTML()}
    <dl>${c.datos.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <div class="tener"><b>A tener en cuenta con este testigo.</b> ${esc(c.tener)}</div>
  </details>`;
}
const legendHTML = () => `<div class="marks-legend"><span><span class="ok">Subrayado verde</span>: detalle exacto</span><span><span class="fx">Rojo</span>: falso, lo ha introducido tu pregunta</span><span><span class="own">Ámbar</span>: error propio del testigo</span></div>`;

function renderIntro() {
  const cards = CASOS.map(c => {
    const max = c.fases.length * PUNTOS.good;
    const best = mejores[c.id];
    return `<button class="case" data-id="${c.id}">
      <span class="tagw">${esc(c.grupo)}</span>
      <h3>${esc(c.nombre)}, ${esc(c.edad)}</h3>
      <span class="ev">${esc(c.evento)}</span>
      <span class="foot"><span class="label">${c.fases.length} fases</span>${best != null ? `<span class="pill ${best / max >= .7 ? "g" : best / max >= .45 ? "m" : "b"}">Mejor: ${best}/${max}</span>` : `<span class="label">Sin entrevistar</span>`}</span>
    </button>`;
  }).join("");
  app.innerHTML = `${topHTML()}
  <section class="intro">
    <span class="label">Caso práctico de entrevista cognitiva</span>
    <h1>Atraco en el Minimarket Rosa</h1>
    <p>Un mismo delito y cuatro testigos que lo vivieron desde lugares, estados y edades distintos. Tú solo tienes el atestado. Elige a quién entrevistar y, en cada fase, la pregunta que harías. Una buena pregunta recupera lo que el testigo vio. Una pregunta sugestiva hace que te devuelva lo que tú le has puesto en la boca.</p>
  </section>
  ${atestadoHTML()}
  <div class="legend">
    <div class="rule g"><b>+${PUNTOS.good} pts</b>Bien formulada: abierta, no sugiere, facilita el recuerdo.</div>
    <div class="rule m"><b>+${PUNTOS.mid} pts</b>Mejorable: cerrada, interrumpe, presiona o no se adapta.</div>
    <div class="rule b"><b>+${PUNTOS.bad} pts</b>Mal formulada: sugestiva, juzga o contamina el recuerdo.</div>
  </div>
  ${legendHTML()}
  <h2>Elige un testigo</h2>
  <div class="cases">${cards}</div>
  <div class="row"><button class="ghost" id="comp">Ver la verdad y la comparativa (para el final)</button></div>`;
  bindTop();
  app.querySelectorAll(".case").forEach(b => b.onclick = () => go({ ...VACIO(), screen: "ficha", caso: b.dataset.id }));
  document.getElementById("comp").onclick = () => go({ ...VACIO(), screen: "comparativa" });
}

function renderFicha() {
  const c = caso();
  app.innerHTML = `${topHTML()}
  <div class="phase-head"><span class="label">${esc(c.grupo)}</span><h2>${esc(c.nombre)}, ${esc(c.edad)}</h2><p class="context">${esc(c.evento)}</p></div>
  ${fichaHTML(c, true)}
  <div class="row"><button class="cta" id="start">Empezar la entrevista</button><button class="ghost" id="back">Elegir otro testigo</button></div>`;
  bindTop();
  document.getElementById("start").onclick = () => go({ ...VACIO(), screen: "fase", caso: c.id, orden: shuffle([0, 1, 2]) });
  document.getElementById("back").onclick = () => go(VACIO());
}

function renderFase() {
  const c = caso(), F = c.fases[S.fase];
  const pick = S.picks.find(p => p.f === S.fase);
  const lines = [];
  if (F.testigo) lines.push(`<div class="line wit"><span class="who">${esc(c.nombre)}</span><div class="said">${esc(F.testigo)}</div></div>`);
  let gain = "";
  if (pick) {
    const o = F.opciones[pick.o];
    lines.push(`<div class="line you new"><span class="who">Tú</span><div class="said">${esc(o.q)}</div></div>`);
    lines.push(`<div class="line wit new"><span class="who">${esc(c.nombre)}</span><div class="said">${marcas(pick.r)}</div></div>`);
    const nOk = extrae(pick.r, RE_OK).length, nFx = extrae(pick.r, RE_FX).length, nOwn = extrae(pick.r, RE_OWN).length;
    let nota = "";
    if (nFx) nota = "Esto no lo vio: se lo ha dado tu pregunta.";
    else if (o.corrige) nota = "El testigo corrige sus propios errores.";
    else if (nOwn) nota = "Error del propio testigo: nadie se lo ha sugerido, pero queda en la declaración.";
    else if (o.respuestaMeta && S.flags.meta) nota = "Gracias a tus instrucciones, separa lo que vio de lo que supone.";
    else if (!nOk) nota = "La respuesta no aporta información nueva.";
    gain = `<div class="gain"><span class="pill g">+${nOk} exactos</span><span class="pill b">+${nFx} inducidos</span>${nOwn ? `<span class="pill m">+${nOwn} propios</span>` : ""}${nota ? `<span>${nota}</span>` : ""}</div>`;
  }
  const opts = S.orden.map((idx, n) => {
    const o = F.opciones[idx];
    const rev = !!pick;
    const cls = rev ? `revealed r-${o.calidad} ${pick.o === idx ? "chosen" : ""}` : "";
    const fb = rev ? `<div class="fb"><span class="tag">${ETIQUETA[o.calidad]} · ${esc(o.tipo)} · +${PUNTOS[o.calidad]}</span><span>${esc(o.porque)}</span></div>` : "";
    return `<button class="opt ${cls}" data-i="${idx}" ${rev ? "disabled" : ""}><span class="k">${"ABC"[n]}</span><span class="q">${esc(o.q)}</span>${fb}</button>`;
  }).join("");
  const last = S.fase === c.fases.length - 1;
  app.innerHTML = `${topHTML()}
  ${fichaHTML(c, false)}
  <div class="phase-head">
    <span class="label">Fase ${S.fase + 1} de ${c.fases.length}</span>
    <h2>${esc(F.fase)}</h2>
    <span class="principio">${esc(F.principio)}</span>
    <p class="context">${esc(F.contexto)}</p>
  </div>
  <div class="transcript">${lines.join("")}${gain}</div>
  <div class="options" role="group" aria-label="Elige una pregunta">${opts}</div>
  ${pick ? `<button class="cta" id="next">${last ? "Ver resultado" : "Siguiente fase"}</button>` : `<span class="label">Elige la pregunta que harías</span>`}`;
  bindTop();
  app.querySelectorAll(".opt:not(:disabled)").forEach(b => b.onclick = () => {
    const o = F.opciones[+b.dataset.i];
    const r = respuesta(o, S.flags);
    if (o.flag) S.flags[o.flag] = true;
    S.picks.push({ f: S.fase, o: +b.dataset.i, r });
    render();
  });
  const nx = document.getElementById("next");
  if (nx) { nx.focus({ preventScroll: true }); nx.onclick = () => {
    if (last) { S.screen = "fin"; guardarMejor(); } else { S.fase++; S.orden = shuffle([0, 1, 2]); }
    render(); window.scrollTo({ top: 0, behavior: "smooth" });
  }; }
}

function guardarMejor() {
  const pts = puntos(S.picks);
  if (mejores[S.caso] == null || pts > mejores[S.caso]) mejores[S.caso] = pts;
  try { localStorage.setItem("ec-rosa-mejores", JSON.stringify(mejores)); } catch (e) {}
}

const li = arr => arr.length ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="none">Ninguno.</p>`;
const hechosHTML = () => `<div class="truth"><span class="label">Lo que pasó de verdad</span><ul class="debate">${HECHOS.map(h => `<li>${esc(h)}</li>`).join("")}</ul></div>`;

function renderFin() {
  const c = caso();
  const MAX = c.fases.length * PUNTOS.good;
  const pts = puntos(S.picks), pct = Math.round(pts / MAX * 100);
  const d = detalles();
  const banda = d.fx.length >= 4 && pct < 70 ? BANDAS[3] : BANDAS.find(b => pct >= b.min);
  const n = q => S.picks.filter(p => opcion(p).calidad === q).length;
  const rows = S.picks.map(p => {
    const F = c.fases[p.f], o = F.opciones[p.o];
    const mejor = F.opciones.find(x => x.calidad === "good");
    return `<div class="rv"><span class="stripe s-${o.calidad}"></span>
      <div class="body"><span class="label">${p.f + 1} · ${esc(F.fase)}</span>
        <span class="q">${esc(o.q)}</span>
        <span class="why">${esc(o.tipo)}. ${esc(o.porque)}</span>
        ${o.calidad !== "good" ? `<span class="better"><b>Mejor:</b> ${esc(mejor.q)}</span>` : ""}
      </div><span class="pts">+${PUNTOS[o.calidad]}</span></div>`;
  }).join("");
  const ownList = d.own.length || d.corregidos.length
    ? `<ul>${d.own.map(x => `<li>${esc(x)}</li>`).join("")}${d.corregidos.map(x => `<li><s>${esc(x)}</s> (corregido en la revisión)</li>`).join("")}</ul>`
    : `<p class="none">Ninguno.</p>`;
  app.innerHTML = `${topHTML()}
  <span class="label">Resultado · ${esc(c.titulo)}</span>
  <div class="score">
    <div class="big">${pts}<small> / ${MAX}</small></div>
    <div class="verdict"><h2>${banda.titulo} · ${pct}%</h2><p>${banda.texto}</p></div>
  </div>
  <div class="row"><span class="pill g">${n("good")} bien formuladas</span><span class="pill m">${n("mid")} mejorables</span><span class="pill b">${n("bad")} mal formuladas</span></div>
  <div class="compare three">
    <div class="box g"><h3>${d.ok.length} de ${totalExactos(c)} exactos</h3><p class="label">Lo que vio de verdad y consta en la declaración</p>${li(d.ok)}</div>
    <div class="box b"><h3>${d.fx.length} inducidos</h3><p class="label">Comisiones creadas por tus preguntas</p>${li(d.fx)}</div>
    <div class="box o"><h3>${d.own.length} propios</h3><p class="label">Errores que aporta el testigo por sí solo</p>${ownList}</div>
  </div>
  ${hechosHTML()}
  <h3>Repaso fase a fase</h3>
  <div class="review">${rows}</div>
  <div class="row"><button class="cta" id="again">Repetir con ${esc(c.nombre)}</button><button class="ghost" id="home">Entrevistar a otro testigo</button><button class="ghost" id="comp">Comparativa de los 4 testigos</button></div>`;
  bindTop();
  document.getElementById("again").onclick = () => go({ ...VACIO(), screen: "fase", caso: c.id, orden: shuffle([0, 1, 2]) });
  document.getElementById("home").onclick = () => go(VACIO());
  document.getElementById("comp").onclick = () => go({ ...VACIO(), screen: "comparativa" });
}

function renderComparativa() {
  const head = `<tr><th>Dato real</th>${CASOS.map(c => `<th>${esc(c.nombre)} (${esc(c.edad.replace(" años", ""))})</th>`).join("")}</tr>`;
  const body = COMPARATIVA.map(([dato, ...cols]) => `<tr><td>${esc(dato)}</td>${cols.map(([k, v]) => `<td class="${k}">${esc(v)}</td>`).join("")}</tr>`).join("");
  app.innerHTML = `${topHTML()}
  <div class="phase-head"><span class="label">Para el final</span><h2>La verdad y la comparativa</h2>
  <p class="context">Ninguno de los cuatro testigos tiene la historia completa. Juntando solo lo exacto de cada uno se reconstruye casi todo el suceso. La tabla muestra lo que aporta cada testigo en una buena entrevista.</p></div>
  ${hechosHTML()}
  <div class="tablewrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
  <p class="label">✓ dato exacto · — no lo menciona (no pudo verlo u omisión) · comisión: aporta información falsa</p>
  <p>Comisiones que solo aparecen con una mala entrevista: la moto roja (Montse), el cuchillo grande y el cambio de color (Pol), la descripción del cuchillo (Laia).</p>
  <h3>Preguntas para el debate</h3>
  <ol class="debate">${DEBATE.map(q => `<li>${esc(q)}</li>`).join("")}</ol>
  <p class="label">Referencia: de la Fuente Arnanz, J. (2016). La memoria de los testigos. Editorial UOC. Cap. 4. El caso es ficticio.</p>
  <div class="row"><button class="cta" id="home">Volver a los testigos</button></div>`;
  bindTop();
  document.getElementById("home").onclick = () => go(VACIO());
}

function go(next) { S = next; render(); window.scrollTo({ top: 0 }); }
function render() {
  if (!["intro", "comparativa"].includes(S.screen) && !caso()) S = VACIO();
  if (!S.flags) S.flags = {};
  ({ intro: renderIntro, ficha: renderFicha, fase: renderFase, fin: renderFin, comparativa: renderComparativa })[S.screen]();
}

window.claude?.hot?.snapshot?.(() => S);
function start(data) { if (data && data.screen && data.picks && data.picks.every(p => typeof p.r === "string")) S = Object.assign(VACIO(), data); render(); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>

</html>
